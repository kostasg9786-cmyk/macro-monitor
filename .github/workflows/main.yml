name: Update Macro Monitor

on:
  schedule:
    - cron: '34 21 * * 4'  # Τρέχει κάθε Πέμπτη στις 21:34 UTC (23:34 ώρα Ελλάδος, μόλις βγει η Fed)
    - cron: '34 10 25 * *' # Τρέχει κάθε 25 του μηνός στις 10:34 UTC (12:34 ώρα Ελλάδος για τη FINRA)
  workflow_dispatch:      # Σου επιτρέπει να το τρέχεις και χειροκίνητα όποτε θες

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install requests beautifulsoup4

    - name: Run Scraper & Alert System
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python leverage_monitor.py

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: .
        branch: gh-pages
